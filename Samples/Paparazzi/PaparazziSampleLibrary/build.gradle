import org.jetbrains.kotlin.gradle.dsl.JvmTarget

buildscript {
    ext {
        versions = [
                'compose': [
                        'compilerExt': '1.5.14',
                        'core'       : '1.5.14',
                        'material'   : '1.6.7',
                        'ui'         : '1.6.7',
                ]
        ]
    }
}

plugins {
    id 'com.android.library'
    alias(libs.plugins.google.devtools.ksp)
    id 'com.google.dagger.hilt.android'
    id 'app.cash.paparazzi'
    alias(libs.plugins.compose.compiler)
}

android {
    namespace 'dev.testify.samples.paparazzi.library'
    compileSdk 36

    defaultConfig {
        minSdkVersion 26
        targetSdkVersion 36

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_25
        targetCompatibility JavaVersion.VERSION_25
    }
    kotlin {
        compilerOptions {
            jvmTarget.set(JvmTarget.JVM_25)
        }
    }
    buildFeatures {
        compose true
    }
    // Publishes the `src/testFixtures` source set as a consumable variant so that :PaparazziSample
    // (and any other module migrating from Testify) can share PaparazziTestRule.
    testFixtures {
        enable true
    }
    composeOptions {
        kotlinCompilerExtensionVersion "${versions.compose.compilerExt}"
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    testOptions {
        unitTests.all {
            // See :PaparazziSample — one JVM per Paparazzi test class.
            forkEvery = 1
        }
    }
}

dependencies {
    ksp "com.google.dagger:dagger-compiler:2.60.1"
    ksp "com.google.dagger:hilt-compiler:2.60.1"

    def composeBom = platform('androidx.compose:compose-bom:2025.08.01')
    implementation composeBom
    //noinspection UseTomlInstead
    implementation "androidx.hilt:hilt-navigation-compose:1.2.0"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.9.3"
    implementation "androidx.test.espresso.idling:idling-concurrent:3.7.0"
    implementation "com.google.dagger:hilt-android:2.60.1"
    implementation 'androidx.compose.material3:material3:1.3.2'
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'io.ktor:ktor-client-android:3.2.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0'
    implementation("io.coil-kt:coil-compose:2.7.0")

    // Shared Paparazzi support, consumed via `testImplementation testFixtures(project(...))`.
    // Paparazzi itself is compileOnly: the runtime is contributed by the consuming module's
    // `app.cash.paparazzi` Gradle plugin, and it must never reach an Android runtime classpath.
    testFixturesCompileOnly libs.paparazzi
    testFixturesApi 'junit:junit:4.13.2'
    testFixturesImplementation composeBom
    testFixturesImplementation 'androidx.compose.runtime:runtime'
    testFixturesImplementation "io.coil-kt:coil-compose:2.7.0"
    testFixturesImplementation libs.kotlinx.coroutines.test

    androidTestImplementation composeBom
    androidTestImplementation "androidx.compose.ui:ui-test-junit4:${versions.compose.ui}"
    androidTestImplementation "androidx.test:rules:1.7.0"

    androidTestImplementation project(":Library")
    androidTestImplementation project(":ComposeExtensions")
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}