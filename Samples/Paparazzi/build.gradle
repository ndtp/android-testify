import org.jetbrains.kotlin.gradle.dsl.JvmTarget

buildscript {
    ext {
        versions = [
                'compose': [
                        'compilerExt': '1.5.14',
                        'core'       : '1.5.14',
                        'material'   : '1.6.7',
                        'ui'         : '1.6.7',
                ]
        ]
    }
}

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'com.google.android.libraries.mapsplatform.secrets-gradle-plugin'
    id 'kotlin-kapt'
    id 'com.google.dagger.hilt.android'
    id 'app.cash.paparazzi'
    alias(libs.plugins.compose.compiler)
}

secrets {
    defaultPropertiesFileName = 'local.defaults.properties'
}

android {
    namespace 'dev.testify.samples.paparazzi'
    compileSdkVersion 36

    defaultConfig {
        applicationId "dev.testify.samples.paparazzi"
        minSdkVersion 26
        targetSdkVersion 36
        versionCode 1
        versionName "1.0"

        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_25
        targetCompatibility JavaVersion.VERSION_25
    }
    kotlin {
        compilerOptions {
            jvmTarget.set(JvmTarget.JVM_25)
            freeCompilerArgs.add("-opt-in=kotlin.time.ExperimentalTime")
        }
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion "${versions.compose.compilerExt}"
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    lintOptions {
        disable 'UseTomlInstead'
    }

    testOptions {
        unitTests.all {
            // One JVM per Paparazzi test class.
            //
            // Paparazzi tears down its layoutlib render session -- including the main Looper -- after
            // every test, but a number of caches keyed to that session are process-wide and are not
            // rebuilt. The visible symptom is that only the first test class in a JVM decodes images:
            // in every class after it, Coil never delivers a bitmap before the frame is captured and
            // AsyncImage records as an empty slot. PaparazziTestRule repairs Dispatchers.Main, which
            // is enough within a class, but not across them.
            //
            // This matters more than it looks: the tests still PASS when this happens, because
            // Paparazzi will happily record a blank image as the golden. Gradle also does not order
            // test classes deterministically, so without this the suite silently records different
            // output from run to run depending on which class ran first.
            forkEvery = 1
        }
    }
}

// Allow references to generated code
kapt {
    correctErrorTypes true
}

dependencies {

    implementation project(":PaparazziSampleLibrary")

    // Core Android
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.9.3"
    implementation "androidx.appcompat:appcompat:1.7.1"

    // UI Layer
    def composeBom = platform('androidx.compose:compose-bom:2025.08.01')
    implementation composeBom
    implementation 'androidx.compose.material3:material3:1.3.2'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation("io.coil-kt:coil-compose:2.7.0")
    implementation "com.google.accompanist:accompanist-systemuicontroller:0.36.0"
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // Dependency injection
    implementation "com.google.dagger:hilt-android:2.57.1"
    kapt "com.google.dagger:hilt-compiler:2.57.1"

    // Navigation
    implementation "androidx.navigation:navigation-compose:2.9.3"
    implementation "androidx.hilt:hilt-navigation-compose:1.2.0"

    implementation("org.jetbrains.kotlinx:kotlinx-datetime:0.7.1")

    implementation "androidx.test.espresso.idling:idling-concurrent:3.7.0"

    // Network Stack
    implementation("io.ktor:ktor-client-core:3.2.3")
    implementation("io.ktor:ktor-client-android:3.2.3")
    implementation("io.ktor:ktor-client-logging:3.2.3")
    implementation("io.ktor:ktor-client-content-negotiation:3.2.3")
    implementation("io.ktor:ktor-serialization-kotlinx-json:3.2.3")

    // Test Support
    testImplementation 'junit:junit:4.13.2'
    testImplementation testFixtures(project(":PaparazziSampleLibrary"))
}
