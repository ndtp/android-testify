import org.jetbrains.kotlin.gradle.dsl.JvmTarget

buildscript {
    ext {
        versions = [
                'compose': [
                        'compilerExt': '1.5.14',
                        'ui'         : '1.6.7',
                ]
        ]
    }
}

plugins {
    id 'com.android.library'
    alias(libs.plugins.google.devtools.ksp)
    id 'com.google.dagger.hilt.android'
    id 'dev.testify'
    alias(libs.plugins.compose.compiler)
}

android {
    namespace 'dev.testify.samples.flix.hilt'
    compileSdk 36

    defaultConfig {
        minSdkVersion 26
        targetSdkVersion 36

        // Hilt tests need HiltTestApplication. This setting is module-wide, which is why the
        // example lives here rather than in :FlixSample — see HiltTestRunner.
        testInstrumentationRunner "dev.testify.samples.flix.hilt.HiltTestRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_25
        targetCompatibility JavaVersion.VERSION_25
    }
    kotlin {
        compilerOptions {
            jvmTarget.set(JvmTarget.JVM_25)
        }
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion "${versions.compose.compilerExt}"
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2025.08.01')
    implementation composeBom

    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation 'androidx.compose.material3:material3:1.3.2'
    implementation "androidx.hilt:hilt-navigation-compose:1.2.0"
    implementation "com.google.dagger:hilt-android:2.60.1"
    ksp "com.google.dagger:hilt-compiler:2.60.1"

    // HiltComposableTestActivity extends ComposableTestActivity, which implements an interface from
    // the core library, so both are needed to compile it.
    compileOnly project(":Library")
    compileOnly project(path: ":ComposeExtensions")

    androidTestImplementation composeBom
    androidTestImplementation project(":Library")
    androidTestImplementation project(path: ":ComposeExtensions")
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation "androidx.test:core-ktx:1.4.0"
    androidTestImplementation "androidx.test:rules:1.7.0"
    androidTestImplementation "androidx.compose.ui:ui-test-junit4:${versions.compose.ui}"

    androidTestImplementation "com.google.dagger:hilt-android-testing:2.60.1"
    kspAndroidTest "com.google.dagger:hilt-compiler:2.60.1"
}

testify {
    applicationPackageId "dev.testify.samples.flix.hilt.test"
    testPackageId "dev.testify.samples.flix.hilt.test"
    autoImplementLibrary false
}
