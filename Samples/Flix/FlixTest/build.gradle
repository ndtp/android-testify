import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.test'
    id 'dev.testify'
    alias(libs.plugins.compose.compiler)
}

android {
    namespace 'dev.testify.samples.flix.test'
    compileSdk 36

    // Target the Flix application module
    targetProjectPath ':FlixSample'

    defaultConfig {
        minSdkVersion 26
        targetSdk 36

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_25
        targetCompatibility JavaVersion.VERSION_25
    }
    kotlin {
        compilerOptions {
            jvmTarget.set(JvmTarget.JVM_25)
        }
    }
    buildFeatures {
        compose true
    }
}

dependencies {

    implementation project(":Library")
    implementation project(":ComposeExtensions")

    def composeBom = platform('androidx.compose:compose-bom:2025.08.01')
    implementation composeBom
    implementation 'androidx.compose.material3:material3:1.3.2'

    // AndroidX Test
    implementation 'androidx.test.ext:junit:1.3.0'
    // ComposableScreenshotRule extends ActivityTestRule, which lives here.
    implementation "androidx.test:rules:1.7.0"
    implementation "androidx.test:runner:1.7.0"

    // Align lifecycle with the application under test, to keep the test APK and app APK from
    // disagreeing on the version.
    implementation "androidx.lifecycle:lifecycle-common:2.9.3"
    implementation "androidx.lifecycle:lifecycle-runtime:2.9.3"
}

testify {
    // applicationPackageId and testPackageId are both inferred for a test module:
    // the application under test comes from `targetProjectPath`, and the test APK is this module.
    autoImplementLibrary false
}
