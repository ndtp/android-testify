import org.jetbrains.kotlin.gradle.dsl.JvmTarget

buildscript {
    ext {
        versions = [
                'compose': [
                        'compilerExt': '1.5.14',
                        'core'       : '1.5.14',
                        'material'   : '1.6.7',
                        'ui'         : '1.6.7',
                ]
        ]
    }
}

plugins {
    id 'com.android.test'
    id 'org.jetbrains.kotlin.android'
    id 'dev.testify'
    alias(libs.plugins.compose.compiler)
}

android {
    namespace 'dev.testify.samples.flix.test'
    compileSdk 36

    // Target the Flix application module
    targetProjectPath ':FlixSample'

    defaultConfig {
        minSdkVersion 26
        targetSdk 36

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlin {
        compilerOptions {
            jvmTarget.set(JvmTarget.JVM_21)
        }
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion "${versions.compose.compilerExt}"
    }
    lintOptions {
        disable 'UseTomlInstead'
    }
}

dependencies {

    implementation project(":Library")
    implementation project(":ComposeExtensions")

    // AndroidX Test
    implementation 'androidx.test.ext:junit:1.3.0'
    implementation 'androidx.test.espresso:espresso-core:3.7.0'
    implementation "androidx.test:rules:1.7.0"
    implementation "androidx.test:runner:1.7.0"

    // Align lifecycle version with the target app to prevent classpath conflicts
    // between the test APK and app APK.
    implementation "androidx.lifecycle:lifecycle-common:2.9.3"
    implementation "androidx.lifecycle:lifecycle-runtime:2.9.3"


    def composeBom = platform('androidx.compose:compose-bom:2025.08.01')
    implementation composeBom
    //noinspection UseTomlInstead
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "androidx.hilt:hilt-navigation-compose:1.2.0"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.9.3"
    implementation "androidx.test.espresso.idling:idling-concurrent:3.7.0"
    implementation "com.google.dagger:hilt-android:2.57.1"
    implementation 'androidx.compose.material3:material3:1.3.2'
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'io.ktor:ktor-client-android:3.2.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0'
    implementation("io.coil-kt:coil-compose:2.7.0")
}

testify {
    applicationPackageId "dev.testify.samples.flix.test"
    testPackageId "dev.testify.samples.flix.test"
    autoImplementLibrary false
}
