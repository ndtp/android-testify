[versions]
gradle = "8.13.2"
junitJupiter = "5.8.2"
kotlin = "2.2.0"
ktlint = "14.2.0"
mockk = "1.14.11"
truthVersion = "1.2.0"

[libraries]
gradle = { module = "com.android.tools.build:gradle", version.ref = "gradle" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junitJupiter" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junitJupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kotlin-stdlib-jdk8 = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk8", version.ref = "kotlin" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
truth-v120 = { module = "com.google.truth:truth", version.ref = "truthVersion" }

[plugins]
# Kept in step with the root catalog's `ktlint` version. This is a separate included build,
# so the two catalogs cannot share a value automatically — bump both together.
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
