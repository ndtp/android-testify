import com.android.build.gradle.tasks.BundleAar
import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.library'
    id 'org.jetbrains.dokka'
    id 'maven-publish'
    id 'signing'
    alias(libs.plugins.compose.compiler)
}

ext {
    pom = [
            publishedGroupId  : 'dev.testify',
            artifact          : 'testify-compose',
            libraryName       : 'testify-compose',
            libraryDescription: 'Jetpack Compose extensions for Android Testify',
            siteUrl           : 'https://github.com/ndtp/android-testify',
            gitUrl            : 'https://github.com/ndtp/android-testify.git',
            licenseName       : 'The MIT License',
            licenseUrl        : 'https://opensource.org/licenses/MIT',
            author            : 'ndtp'
    ]
}

version = project.findProperty("testify_version") ?: "0.0.1-SNAPSHOT"
group = pom.publishedGroupId

// Gradle 9 removed the `archivesBaseName` property; `base.archivesName` is the replacement.
// This drives the androidTest APK name (which bitrise.yml pins), not just the AAR.
base {
    archivesName = pom.artifact
}

android {
    namespace "dev.testify.compose"

    lint {
        abortOnError true
        warningsAsErrors true
        textOutput = file('stdout')
        textReport true
        xmlReport false
    }

    defaultConfig {
        compileSdk libs.versions.compileSdk.get().toInteger()
        minSdkVersion libs.versions.minSdk.get().toInteger()
        targetSdkVersion libs.versions.targetSdk.get().toInteger()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled = true
    }

    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.all {
            testLogging {
                events "passed", "skipped", "failed", "standardOut", "standardError"
                outputs.upToDateWhen { false }
                showStandardStreams = true
            }
        }
    }

    buildFeatures {
        viewBinding true
        compose true
    }

    kotlin {
        compilerOptions {
            allWarningsAsErrors.set(true)
            jvmTarget.set(JvmTarget.JVM_25)
            freeCompilerArgs.addAll("-Xcontext-parameters")
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_25
        targetCompatibility JavaVersion.VERSION_25
    }

    dependencies {
        implementation project(":Library")

        implementation(platform(libs.androidx.compose.bom))
        implementation libs.androidx.activity.compose
        implementation libs.androidx.appcompat
        implementation libs.androidx.core.ktx
        implementation libs.androidx.espresso.core
        implementation libs.androidx.lifecycle.runtime.ktx
        implementation libs.androidx.material
        implementation libs.androidx.rules
        implementation libs.androidx.runner
        implementation libs.androidx.ui
        implementation libs.androidx.ui.test.junit4
        implementation libs.androidx.ui.tooling.preview
    }

    publishing {
        singleVariant("release") {
            // if you don't want sources/javadoc, remove these lines
            withSourcesJar()
            withJavadocJar()
        }
    }
}

// AGP 9 removed the legacy `libraryVariants` API that was previously used to set
// `outputFileName`. The AAR is renamed by configuring its bundle task directly.
tasks.withType(BundleAar).configureEach {
    archiveFileName.set("${pom.artifact}-${version}.aar")
}

afterEvaluate {
    apply from: "../../publish.build.gradle"
}
